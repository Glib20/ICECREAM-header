<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IceCream</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

</head>

<body>

<header>

<div class="logo">
<img src="./img/logo.svg" alt="logo">


<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">About us</a></li>
<li><a href="#">How it's made?</a></li>
<li><a href="#">Our products</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>

<button class="buy">Buy now ></button>

</header>

<main>

<section class="hero">

<article class="hero-text">

<h2>
ICE CREAM <br>
MADE WITH <br>
<span>PASSION</span>
</h2>

<div class="buttons">
<button class="btn-red">Products</button>
<button class="btn-white">How it's made?</button>
</div>

</article>

<figure class="hero-icecream">
<img src="./img/icecream.svg" alt="ice cream">
</figure>

<aside class="hero-stats">

<p class="stat">
<span>16</span>
cafes
</p>

<p class="stat">
<span>23</span>
food trucks
</p>

</aside>

</section>

<section class="hero-bottom">

<div class="bottom-left">

<figure class="milk">
<img src="./img/milk.svg" alt="milk">
</figure>

<p class="hero-description">
Lorem ipsum dolor sit amet, consectetur adipiscing elit,
sed do eiusmod tempor incididunt ut labore et.
</p>

</div>

<figure class="girl">
<img src="./img/girl.svg" alt="girl eating ice cream">
</figure>

</section>

</main>

</body>
</html>
