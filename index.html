<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IceCream</title>

<link rel="stylesheet" href="./style3.css">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">
  <a href="#" class="header__logo">
    <img src="./img/logo.svg" alt="logo">
  </a>

  <nav class="header__nav">
    <ul class="header__list">
      <li><a class="header__link" href="#">Home</a></li>
      <li><a class="header__link" href="#">About us</a></li>
      <li><a class="header__link" href="#">How it's made?</a></li>
      <li><a class="header__link" href="#">Our products</a></li>
      <li><a class="header__link" href="#">Contact</a></li>
    </ul>
  </nav>

  <button class="header__btn">Buy now ></button>
</header>

<main class="main">

<section class="hero">

  <!-- TEXT -->
  <article class="hero__content">
    <h2 class="hero__title">
      ICE CREAM <br>
      MADE WITH <br>
      <span class="hero__accent">PASSION</span>
    </h2>

    <div class="hero__buttons">
      <button class="hero__btn hero__btn--primary">Products</button>
      <button class="hero__btn hero__btn--secondary">How it's made?</button>
    </div>
  </article>

  <!-- ICECREAM -->
  <figure class="hero__image">
    <img src="./img/icecream.svg" alt="">
  </figure>

  <!-- STATS -->
  <aside class="hero__stats">
    <p class="hero__stat"><span>16</span> cafes</p>
    <p class="hero__stat"><span>23</span> food trucks</p>
  </aside>

  <!-- DECORATIVE LAYER -->
  <div class="hero-bottom">

    <figure class="hero-bottom__milk">
      <img src="./img/milk.svg" alt="">
    </figure>

    <p class="hero-bottom__text">
      Lorem ipsum dolor sit amet, consectetur adipiscing elit,
      sed do eiusmod tempor incididunt ut labore et.
    </p>

    <figure class="hero-bottom__girl">
      <img src="./img/girl.svg" alt="">
    </figure>

  </div>

</section>

</main>

</body>
</html>
